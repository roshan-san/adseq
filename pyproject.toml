[project]
name = "adseq"
version = "0.1.0"
description = "Residual recurrent networks (RNN/GRU/LSTM) for 24-h biogas forecasting from full-scale co-digestion SCADA data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "tyro>=0.9",
    "matplotlib>=3.9",
    "lightgbm>=4.7.0",
    "optuna>=4",
    "mlflow>=3",
    "scikit-learn>=1.4",
]

[project.scripts]
adseq = "adseq.cli:main"

[dependency-groups]
dev = ["ruff>=0.8"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu132 = ["torch>=2.5"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["E501", "SIM905"]

[tool.pyright]
venvPath = "."
venv = ".venv"
exclude = ["references", "data", "runs", "mlruns", ".venv"]
