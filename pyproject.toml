[project]
name = "adseq"
version = "0.1.0"
description = "Residual recurrent networks (RNN/GRU/LSTM) for 24-h biogas forecasting from full-scale co-digestion SCADA data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "tyro>=0.9",
    "matplotlib>=3.9",
    "wandb>=0.31.0",
    "lightgbm>=4.7.0",
]

[project.scripts]
adseq = "adseq.main:main"

[dependency-groups]
dev = ["ruff>=0.8", "pytest>=8.3"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# PyTorch build, chosen per machine (the code is the same):
#   uv sync --extra cpu     no NVIDIA GPU (small; no CUDA)
#   uv sync --extra cu132   NVIDIA GPU (CUDA 13.2 build; nvidia-smi must show "CUDA Version" >= 13.2)
# A plain `uv sync` without either removes torch.
[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu132 = ["torch>=2.5"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu132" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "cu132" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]  # else stray wandb/ run dirs in the root count as first-party

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["E501", "SIM905"]  # SIM905: allow "a b c".split() for name lists
